name: Deploy Slidev to GitHub Pages

on:
  push:
    branches: [ main ]
    paths:
      - 'Shells_42M/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

defaults:
  run:
    working-directory: Shells_42M

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: Shells_42M/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build slides
        run: pnpm slidev build --base /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: Shells_42M/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4